<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#5a1e14"/><stop offset=".6" stop-color="#2a0c0a"/><stop offset="1" stop-color="#120606"/></radialGradient>
    <radialGradient id="clash" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffcf3f"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="coolglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bfe9ff" stop-opacity=".35"/><stop offset="1" stop-color="#bfe9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="warmglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- side-color wash: cool air (left) vs warm fire (right) -->
  <circle cx="130" cy="260" r="190" fill="url(#coolglow)"/>
  <circle cx="382" cy="260" r="190" fill="url(#warmglow)"/>
  <!-- the clash in the middle -->
  <circle cx="256" cy="226" r="118" fill="url(#clash)" opacity=".9"/>
  <g stroke="#ffe08a" stroke-width="6" stroke-linecap="round" opacity=".85">
    <line x1="256" y1="118" x2="256" y2="156"/><line x1="318" y1="146" x2="296" y2="176"/><line x1="194" y1="146" x2="216" y2="176"/>
    <line x1="346" y1="226" x2="310" y2="226"/><line x1="166" y1="226" x2="202" y2="226"/>
  </g>
  <!-- VS mark -->
  <text x="256" y="200" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="38" fill="#fff6d0" stroke="#3a1606" stroke-width="5" paint-order="stroke" letter-spacing="1">／VS</text>

  <!-- air fighter, left: flying knee strike (white/cyan, wind-torn scarf) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 210 L160 300" stroke="#bfe9ff" stroke-width="34" fill="none"/>
    <path d="M146 236 L212 232" stroke="#bfe9ff" stroke-width="22" fill="none"/>
    <circle cx="218" cy="232" r="15" fill="#6fb8e0"/>
    <path d="M142 240 L104 280" stroke="#bfe9ff" stroke-width="20" fill="none"/>
    <path d="M160 300 L184 380 L208 392" stroke="#6fb8e0" stroke-width="24" fill="none"/>
    <path d="M160 300 L120 372 L98 390" stroke="#6fb8e0" stroke-width="24" fill="none"/>
    <circle cx="128" cy="170" r="34" fill="#eaf6ff"/>
    <rect x="98" y="160" width="62" height="16" rx="8" fill="#294a5c"/>
    <circle cx="142" cy="168" r="4" fill="#0c1116"/><circle cx="120" cy="168" r="4" fill="#0c1116"/>
    <path d="M98 152 L60 132 M98 160 L56 158" stroke="#8fd8ff" stroke-width="9" fill="none"/>
  </g>
  <!-- fire fighter, right: a punch (red/orange, flame-tail headband) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 210 L352 300" stroke="#c8161e" stroke-width="34" fill="none"/>
    <path d="M366 236 L300 232" stroke="#c8161e" stroke-width="22" fill="none"/>
    <circle cx="294" cy="232" r="15" fill="#8a0f14"/>
    <path d="M370 240 L408 280" stroke="#c8161e" stroke-width="20" fill="none"/>
    <path d="M352 300 L328 380 L304 392" stroke="#8a0f14" stroke-width="24" fill="none"/>
    <path d="M352 300 L392 372 L414 390" stroke="#8a0f14" stroke-width="24" fill="none"/>
    <circle cx="384" cy="170" r="34" fill="#c8161e"/>
    <rect x="352" y="160" width="62" height="16" rx="8" fill="#ffb347"/>
    <circle cx="370" cy="168" r="4" fill="#1b1b1f"/><circle cx="392" cy="168" r="4" fill="#1b1b1f"/>
    <path d="M414 152 L452 132 M414 160 L456 158" stroke="#ff6a1a" stroke-width="9" fill="none"/>
  </g>
  <!-- the name -->
  <text x="256" y="462" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="58" fill="#ffcf3f" stroke="#3a1606" stroke-width="6" paint-order="stroke" letter-spacing="2">CREATIVE</text>
</svg>
